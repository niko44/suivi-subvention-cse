{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4 border-warning">
            <h3 class="text-center mb-3 text-warning">Sécurité requise</h3>
            <p class="small text-muted text-center">C'est votre première connexion (ou votre mot de passe a été réinitialisé). Veuillez modifier votre mot de passe pour continuer.</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nouveau mot de passe</label>
                    <input type="password" name="new_password" class="form-control" minlength="4" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">Enregistrer le nouveau mot de passe</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
